<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF5F1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Maddie's Gym</title>
<meta name="apple-mobile-web-app-title" content="Maddie's Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Session list, tap an exercise to open a full-screen card. Light only, by request. */
:root{
  --bg:#FFF5F1;
  --blush:#FBE3DE;
  --peach:#FFCFB3;
  --rose:#F3A9B9;
  --ink:#3E2632;
  --muted:#8C6F79;
  --line:#F0D9D3;
  --card:rgba(255,255,255,.78);
  --figure:#6B3550;
  --figure-far:#D8A3B5;
  --kit:#E7D3CB;
  --kit-strong:#C9AFA5;
  --ok:#5E9C7F;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 60% at 100% 0%, #FFE1CF 0%, transparent 60%),radial-gradient(90% 50% at 0% 30%, #FCE0E6 0%, transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--figure);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,var(--peach),var(--rose));display:inline-block}
.date{color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:rgba(255,255,255,.6);border-radius:16px;border:1px solid var(--line)}
.seg button{padding:10px 8px;border-radius:12px;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.seg button b{font-weight:700;font-size:15px}
.seg button span{font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 2px 10px rgba(107,53,80,.10)}
.summary{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#FFD9C2 0%,#FBCFD8 100%);}
.summary h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.summary p{margin:4px 0 0;font-size:14px;color:#6E4A57}
.ring{flex:none;width:58px;height:58px;position:relative;margin-left:auto}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 18px rgba(107,53,80,.06);text-align:left;width:100%}
.thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(140deg,var(--peach),var(--rose))}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(1.06) contrast(.95)}
.thumb::after,.hero .wash{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,196,160,.55),rgba(243,169,185,.45));mix-blend-mode:soft-light}
.thumb svg{position:absolute;inset:8px;width:48px;height:48px}
.row .name{font-weight:600;font-size:16px;line-height:1.25}
.row .meta{font-size:13.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.row .tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:#9A4B66;background:#FCE3EA;border-radius:99px;padding:2px 8px;margin-top:5px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.row.done .check{background:var(--figure);border-color:var(--figure)}
.row.done .check svg{opacity:1}
.check svg{opacity:0}
.row.done .name{color:var(--muted)}
.note{font-size:13px;color:var(--muted);text-align:center;padding:4px 8px}

/* Exercise card */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  background-image:radial-gradient(120% 50% at 100% 100%, #FFE3D3 0%, transparent 60%)}
.sheet.open{transform:none}
.sheet-in{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.hero{position:relative;height:200px;border-radius:24px;overflow:hidden;background:linear-gradient(140deg,var(--peach),var(--rose))}
.hero .wash{background:linear-gradient(180deg,rgba(255,196,160,.35),rgba(243,169,185,.45) 60%,rgba(62,38,50,.55))}
.hero .cap{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.hero .cap small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.hero .cap h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hero .nophoto{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#7A4A5C;font-size:13.5px;padding:0 30px 50px}
.target{display:flex;gap:8px;flex-wrap:wrap}
.target span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.target span.sets{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--card);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:14px;box-shadow:0 4px 18px rgba(107,53,80,.06)}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.anim{background:linear-gradient(160deg,#FFF0E8,#FDE6EC);border-radius:16px;position:relative}
.anim svg{display:block;width:100%;height:auto}
.anim .view{position:absolute;top:10px;left:12px;font-size:11.5px;color:var(--muted);font-weight:600}
.anim .phase{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:var(--figure);background:#fff;border-radius:99px;padding:3px 9px}
.setup{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.setup li{display:flex;gap:10px;font-size:15px}
.setup li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-top:8px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:15px;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.cue{margin-top:10px;padding:10px 12px;border-radius:14px;background:#FFF1E6;font-size:14px;color:#6E4A57}
.log{display:flex;align-items:center;justify-content:space-between;gap:10px}
.log .last{font-size:13.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px}
.stepper button{width:44px;height:44px;border-radius:13px;background:var(--blush);font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper output{min-width:86px;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.stepper output small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.hint{margin-top:10px;font-size:13.5px;color:#9A4B66;display:flex;gap:6px;align-items:flex-start}
.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.btn{padding:15px;border-radius:18px;font-weight:700;font-size:16px;text-align:center}
.btn.soft{background:#fff;border:1px solid var(--line)}
.btn.main{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(62,38,50,.25)}
.swaps{position:fixed;inset:0;z-index:20;background:rgba(62,38,50,.3);display:flex;align-items:flex-end;justify-content:center}
.swaps .box{background:var(--bg);width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:10px}
.swaps h4{margin:0;font-family:var(--display);font-size:20px}
.swaps p{margin:0 0 4px;color:var(--muted);font-size:14px}
.video{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.video .play{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,var(--peach),var(--rose));display:grid;place-items:center;color:#fff;font-size:14px;padding-left:2px}
.video b{display:block;font-size:15px}.video small{color:var(--muted);font-size:13px}.video .arr{color:var(--muted)}
.video:focus-visible{outline:2px solid var(--figure);outline-offset:2px}
.swaps[hidden]{display:none}
.sec{padding:10px 4px 0}.sec h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.sec p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.row.compact{grid-template-columns:52px 1fr auto;padding:8px 10px}.row.compact .thumb{width:52px;height:52px}.row.compact .name{font-size:15px}
.thumb.fig{background:linear-gradient(150deg,#FFEDE2,#FCE1E8)}.thumb.fig::after{display:none}.thumb.fig svg{inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.herofig{position:absolute;inset:10px 10px 56px;width:calc(100% - 20px);height:calc(100% - 66px)}
.hero.slim{height:112px}
.tip{margin:-6px 4px 0;font-size:13.5px;color:#6E4A57}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand"><i></i>Maddie's Gym</div>
    <div class="date" id="date"></div>
  </div>
  <div class="seg" role="group" aria-label="Choose your gym day">
    <button id="dayA" aria-pressed="true"><b>Day A</b><span>Glutes &amp; legs</span></button>
    <button id="dayB" aria-pressed="false"><b>Day B</b><span>Upper body &amp; glutes</span></button>
  </div>
  <div class="summary">
    <div>
      <h1 id="dayTitle">Glutes &amp; core</h1>
      <p id="dayMeta"></p>
    </div>
    <div class="ring"><svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="6"/><circle id="ringArc" cx="29" cy="29" r="24" fill="none" stroke="#6B3550" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg><b id="ringTxt">0/7</b></div>
  </div>
  <p class="tip"><b>Your rule:</b> pick a weight where the last 2 reps feel hard. Hit the top number on every set? Go up next time.</p>
  <div class="list" id="list"></div>
  
</div>

<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="swaps" id="swaps" hidden><div class="box" id="swapBox"></div></div>

    `<button class="btn soft" id="swapCancel">Keep ${e.name.toLowerCase()}</button>`;
  const sw=document.getElementById("swaps");sw.hidden=false;
  box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{order[cur.slot]=b.dataset.id;store.set("order",order);sw.hidden=true;renderList();openCard(cur.slot)});
  document.getElementById("swapCancel").onclick=()=>sw.hidden=true;
  sw.onclick=ev=>{if(ev.target===sw)sw.hidden=true};
}

// ---------- Boot ----------
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
const setDay=d=>{day=d;document.getElementById("dayA").setAttribute("aria-pressed",d==="A");document.getElementById("dayB").setAttribute("aria-pressed",d==="B");renderList()};
document.getElementById("dayA").onclick=()=>setDay("A");document.getElementById("dayB").onclick=()=>setDay("B");
renderList();

</script>

</body>
